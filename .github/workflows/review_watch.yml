name: Review Watch

# Weekly check (Monday ~09:30 IST): pushes a notification when a fund a client
# holds has newly fallen behind its benchmark. Uses the same PUSH_TICK_SECRET.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Call /portfolio/watch/tick
        env:
          TICK_SECRET: ${{ secrets.PUSH_TICK_SECRET }}
        run: |
          code=$(curl -s -o resp.json -w "%{http_code}" --max-time 180 \
                 -X POST -H "X-Tick-Secret: $TICK_SECRET" \
                 https://research-api-8a34.onrender.com/portfolio/watch/tick)
          echo "HTTP status: $code"
          cat resp.json; echo
          if [ "$code" -ge 400 ] || [ "$code" -eq 000 ]; then
            echo "Watch failed"
            exit 1
          fi
