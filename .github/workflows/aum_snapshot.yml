name: AUM Snapshot

# Daily at 23:00 IST (17:30 UTC): saves the value of the whole client book so the
# Client book screen can draw a trend. Uses the same PUSH_TICK_SECRET repo secret.

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Call /crm/aum/snapshot
        env:
          TICK_SECRET: ${{ secrets.PUSH_TICK_SECRET }}
        run: |
          code=$(curl -s -o resp.json -w "%{http_code}" --max-time 180 \
                 -X POST -H "X-Tick-Secret: $TICK_SECRET" \
                 https://research-api-8a34.onrender.com/crm/aum/snapshot)
          echo "HTTP status: $code"
          cat resp.json; echo
          if [ "$code" -ge 400 ] || [ "$code" -eq 000 ]; then
            echo "Snapshot failed"
            exit 1
          fi
