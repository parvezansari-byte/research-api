name: Client Follow-ups

# Daily at 08:35 IST: pushes a notification for client follow-ups that are due today or overdue.
# Uses the same PUSH_TICK_SECRET repo secret as the other workflows.

on:
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch:

jobs:
  followups:
    runs-on: ubuntu-latest
    steps:
      - name: Call /clients/followups/tick
        env:
          TICK_SECRET: ${{ secrets.PUSH_TICK_SECRET }}
        run: |
          code=$(curl -s -o resp.json -w "%{http_code}" --max-time 120 \
                 -X POST -H "X-Tick-Secret: $TICK_SECRET" \
                 https://research-api-8a34.onrender.com/clients/followups/tick)
          echo "HTTP status: $code"
          cat resp.json; echo
          if [ "$code" -ge 400 ] || [ "$code" -eq 000 ]; then
            echo "Follow-up tick failed"
            exit 1
          fi
